# Local development without a dongle: synthetic test signals over plain HTTP,
# plus a throwaway MQTT broker.
#
#   cp .env.dev.example .env    # once: makes plain `docker compose` use this file
#   docker compose up -d --build
#   open http://localhost:8080  (admin / devpassword123)
#
# LAN access (e.g. http://192.168.0.231:8080): set SDRD_DEV_BIND=0.0.0.0 in .env.
# The dev password is public, so home LAN only.
#
# Without the .env shortcut, name the file each time:
#   docker compose -f docker-compose.dev.yml up -d --build

services:
  sdrd:
    build: .
    image: sdr-web-gui:dev
    environment:
      # Starting receiver only: switch source (USB, rtl_tcp, simulated) under
      # Settings -> Receiver -> SDR devices. USB also needs docker-compose.usb.yml.
      SDRD_SOURCE: synthetic
      SDRD_COOKIE_SECURE: "false"
      SDRD_ADMIN_USER: admin
      SDRD_ADMIN_PASSWORD: devpassword123
      SDRD_MQTT_HOST: mqtt
      RUST_LOG: sdrd=debug,tower_http=info
    ports:
      # Localhost only by default. For LAN access set SDRD_DEV_BIND=0.0.0.0 in .env.
      - "${SDRD_DEV_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - sdrd-dev-data:/data
    # Lets an rtl_tcp server on this computer be reached as
    # host.docker.internal:1234 on Linux too (Docker Desktop has it built in).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [mqtt]

  mqtt:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf

volumes:
  sdrd-dev-data:
