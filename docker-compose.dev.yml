# Local development without a dongle: synthetic test signals over plain HTTP,
# plus a throwaway MQTT broker.
#
#   docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:8080  (admin / devpassword123)
#
#   LAN access (e.g. http://192.168.0.231:8080) - the dev password is public, so home LAN only:
#   SDRD_DEV_BIND=0.0.0.0 docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml exec mqtt mosquitto_sub -v -t 'sdrd/#' -t 'homeassistant/#'

services:
  sdrd:
    build: .
    image: sdr-web-gui:dev
    environment:
      SDRD_SOURCE: synthetic
      SDRD_COOKIE_SECURE: "false"
      SDRD_ADMIN_USER: admin
      SDRD_ADMIN_PASSWORD: devpassword123
      SDRD_MQTT_HOST: mqtt
      RUST_LOG: sdrd=debug,tower_http=info
    ports:
      # Localhost only by default. For LAN access: SDRD_DEV_BIND=0.0.0.0 docker compose ...
      - "${SDRD_DEV_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - sdrd-dev-data:/data
    depends_on: [mqtt]

  mqtt:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf

volumes:
  sdrd-dev-data:
