[package]
name = "sdrd"
version = "0.1.0"
edition = "2021"
publish = false
description = "Web-controlled RTL-SDR monitoring daemon"

[features]
default = []
# Link against librtlsdr (rtl-sdr-blog fork recommended). Without it only the
# synthetic and replay sources are available, which is handy for development.
rtlsdr = []

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "macros"] }
bytes = "1"
hex = "0.4"
num-complex = "0.4"
png = "0.17"
rand = "0.8"
rumqttc = { version = "0.24", default-features = false }
rustfft = "6"
sgp4 = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
ureq = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
